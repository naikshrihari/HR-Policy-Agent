[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-policy-agent"
version = "0.1.0"
description = "LangChain/LangGraph port of the Oracle Fusion HR Policy Workflow Agent (Station Casinos HCM Policy Agent)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "typing_extensions>=4.7",
]

[project.optional-dependencies]
openai = ["langchain-openai>=0.2.0"]
anthropic = ["langchain-anthropic>=0.2.0"]
ollama = ["langchain-ollama>=0.2.0"]
rest = ["requests>=2.31"]
# Lightweight, torch-free RAG (recommended): scikit-learn TF-IDF retrieval.
rag = ["scikit-learn>=1.3", "numpy>=1.24"]
# Read PDF / Word handbooks (torch-free).
docs = ["pypdf>=4.0", "docx2txt>=0.8"]
# Persistent vector database with embeddings (torch-free with the openai/ollama providers).
vectordb = ["langchain-chroma>=0.1.4", "langchain-openai>=0.2.0", "pypdf>=4.0", "docx2txt>=0.8"]
# Fully local, torch-free embeddings + chat via an Ollama server.
vectordb-ollama = ["langchain-chroma>=0.1.4", "langchain-ollama>=0.2.0", "pypdf>=4.0", "docx2txt>=0.8"]
# Optional heavier semantic RAG (large download; may hit Windows path limits).
rag-semantic = ["langchain-community>=0.3.0", "faiss-cpu>=1.8", "sentence-transformers>=3.0", "langchain-huggingface>=0.1.0"]

[project.scripts]
hr-policy-agent = "hr_policy_agent.cli:main"

[tool.setuptools.packages.find]
include = ["hr_policy_agent*"]

[tool.setuptools.package-data]
hr_policy_agent = ["prompts/*.txt", "prompts/*.json"]
